name: update-data

on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分（UTC）に実行
  workflow_dispatch:       # 手動実行もできる

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lineups / fixtures / photos
        run: python scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "pl-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: auto update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
